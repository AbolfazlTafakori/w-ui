name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend builds and matches the committed bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
      # The bundle is committed so `go build` works from a plain checkout;
      # the release workflow rebuilds it from source, so a stale commit can
      # never ship. Hashes differ between build hosts, so they are not
      # compared here.

  go:
    name: Go vet, static analysis and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wui
          POSTGRES_PASSWORD: wui
          POSTGRES_DB: wui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: go test -race ./...
        env:
          WUI_TEST_PG_DSN: postgres://wui:wui@localhost:5432/wui?sslmode=disable
      - name: Cross-compiles for every release target
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/wui
          done

  installer:
    name: Installer and menu behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n w-ui.sh
      - run: bash scripts/test-install-questions.sh install.sh
      - run: bash scripts/test-install-output.sh install.sh
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          # Style findings are advisory; anything that is an actual error fails.
          shellcheck -S error install.sh w-ui.sh update.sh

  install-matrix:
    name: Clean install on ${{ matrix.image }} (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: [go]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "almalinux:9", "rockylinux:9", "fedora:41"]
        db: ["sqlite"]
        include:
          - { image: "ubuntu:24.04", db: "postgres" }
          - { image: "almalinux:9", db: "postgres" }
    container:
      image: ${{ matrix.image }}
      # nftables and WireGuard need the host kernel; the runner's has both.
      options: --privileged
    steps:
      - name: Prerequisites the image lacks
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates git sudo >/dev/null
          else
            dnf install -y -q --allowerasing curl ca-certificates git sudo tar
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the panel
        run: CGO_ENABLED=0 go build -buildvcs=false -o /tmp/wui ./cmd/wui
      - name: Run the installer unattended
        run: |
          bash install.sh --local /tmp/wui -y --no-tls --db ${{ matrix.db }} --username ci --password ci-password-12345 2>&1 | tee /tmp/install.log
      - name: The install produced a working panel
        run: |
          grep -q "W-UI is installed" /tmp/install.log
          test -x /usr/local/bin/wui
          test -x /usr/local/bin/w-ui
          test -f /etc/systemd/system/wui.service
          id wui
          command -v wg && command -v nft
          # The binary answers from the data directory the installer made,
          # with the port and path the unit file carries.
          set -a; eval "$(grep -oE 'WUI_[A-Z_]+=[^ ]+' /etc/systemd/system/wui.service)"; . /etc/wui/db.env; set +a
          test "$WUI_DB_DRIVER" = "${{ matrix.db }}"
          WUI_DATA_DIR=/var/lib/wui /usr/local/bin/wui setting show | tee /tmp/show.log
          grep -q "^admin: ci$" /tmp/show.log
          grep -q "^subEnabled: true$" /tmp/show.log
          sub=$(sed -n 's/^subPort: //p' /tmp/show.log); [ "$sub" -ge 1024 ] && [ "$sub" != "${WUI_LISTEN##*:}" ]
          grep -q "^WUI_SUB_PORT=" /etc/wui/install-result.env
          # A backup from the terminal holds the portable dump, and restores.
          runuser -u wui --preserve-environment -- env WUI_DATA_DIR=/var/lib/wui /usr/local/bin/wui backup create --dir /var/backups/wui | tee /tmp/backup.log
          tar tzf "$(tail -1 /tmp/backup.log)" | grep -q '^wui-export.json$'
          runuser -u wui --preserve-environment -- env WUI_DATA_DIR=/var/lib/wui /usr/local/bin/wui backup restore "$(tail -1 /tmp/backup.log)" --dir /var/backups/wui | grep -q staged
          port="${WUI_LISTEN##*:}"; path="/${WUI_BASE_PATH}/"
          echo "port=$port path=$path"
          [ "$port" -ge 1024 ] && [ "${#WUI_BASE_PATH}" -ge 16 ]
          # The panel comes up and answers on its port, without systemd.
          (cd /var/lib/wui && WUI_LISTEN=127.0.0.1:$port WUI_DATA_DIR=/var/lib/wui /usr/local/bin/wui > /tmp/panel.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs -o /dev/null "http://127.0.0.1:$port$path" && break; sleep 1; done
          curl -fs -o /dev/null -w "panel answered %{http_code}\n" "http://127.0.0.1:$port$path"
          curl -s -o /dev/null -w "root is %{http_code}\n" "http://127.0.0.1:$port/" | grep -q 404
          grep -E "enforcement|quota|listening" /tmp/panel.log | head
          # The staged restore was applied at that start, and the admin survived it.
          grep -q "restored from a backup" /tmp/panel.log
          WUI_DATA_DIR=/var/lib/wui /usr/local/bin/wui setting show | grep -q "^admin: ci$"
      - name: Uninstall leaves the packages and a copy of the data
        run: |
          bash install.sh --purge 2>&1 | tee /tmp/uninstall.log
          grep -q "a copy of the database" /tmp/uninstall.log
          ls /root/wui-last-copy-*.tar.gz
          test ! -e /usr/local/bin/wui
          command -v wg

  # The rolling build of the latest commit: what "Update to Dev Channel" in
  # the w-ui menu installs. One pre-release named dev-latest, replaced on
  # every push to main that passed everything above.
  dev-release:
    name: dev-latest pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, frontend, installer, install-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci && npx vite build
        working-directory: web
      - name: Build every platform
        env:
          WUI_PUBLIC_KEY: ${{ vars.WUI_SIGNING_PUBLIC_KEY }}
        run: |
          version="dev-$(git rev-parse --short HEAD)"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath               -ldflags "-s -w -X main.version=${version} -X github.com/abolfazl/w-ui/internal/update.PublicKey=${WUI_PUBLIC_KEY}"               -o "dist/wui-linux-${arch}" ./cmd/wui
          done
          go build -o dist/wui-host ./cmd/wui
      - name: Sign
        env:
          WUI_SIGNING_KEY: ${{ secrets.WUI_SIGNING_KEY }}
        run: |
          [ -n "$WUI_SIGNING_KEY" ] || { echo "::warning::unsigned dev build"; exit 0; }
          for f in dist/wui-linux-*; do dist/wui-host sign "$f"; done
      - name: Checksums and scripts
        run: |
          rm -f dist/wui-host
          cp install.sh w-ui.sh update.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Replace the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          git tag -f dev-latest
          git push -f origin dev-latest
          gh release create dev-latest dist/* --prerelease --title "dev-latest ($(git rev-parse --short HEAD))"             --notes "Rolling build of the latest commit on main. Not a stable release; install it with w-ui → 3 (Update to Dev Channel)."
